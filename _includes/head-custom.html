<!-- Custom head: Open Graph + Twitter social preview image (added via the
     jekyll-theme-cayman documented head-custom.html hook). The {% seo %}
     tag emits og:title/description/url/site_name/type but no image, so
     every share of this page renders a blank preview card. -->
<meta property="og:image" content="https://haoel.github.io/og-image.png" />
<meta property="og:image:type" content="image/png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://haoel.github.io/og-image.png" />
